name: Generate TMD Earthquake GeoJSON File

on:
  schedule:
    - cron: '*/5 * * * *'  # สั่งให้บอตตื่นมาแปลงข้อมูลทุกๆ 5 นาที
  workflow_dispatch:      # สร้างปุ่มสำหรับกดรันเพื่อทดสอบด้วยมือตนเองได้

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # จุดที่แก้ไข: ติดตั้งไลบรารีระบบสากลสำหรับรองรับ GeoPandas บน Ubuntu Linux
    - name: Install System GIS Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas geopandas shapely

    - name: Execute Script
      run: python update_earthquake.py

    - name: Push GeoJSON Back to Repository
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        # ใช้คำสั่งเช็กก่อนว่ามีไฟล์อยู่จริงไหม ถ้ามีค่อย Add เพื่อป้องกันบอตรันพัง
        if [ -f earthquake_latest.geojson ]; then
          git add earthquake_latest.geojson
          git commit -m "Automated update earthquake GeoJSON data" || echo "No changes to commit"
          git push
        else
          echo "[-] ไม่พบไฟล์ earthquake_latest.geojson กรุณาตรวจสอบข้อผิดพลาดในสคริปต์ Python"
          exit 1
        fi
