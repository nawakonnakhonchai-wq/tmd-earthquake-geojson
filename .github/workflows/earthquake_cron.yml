name: Generate TMD Earthquake GeoJSON File

on:
  # ย้ายการดึงข้อมูลอัตโนมัติไปที่ Cloudflare Worker (worker/index.js) แล้ว
  # เหลือไว้เฉพาะปุ่มรันด้วยมือ สำหรับสำรองข้อมูลลง repo
  workflow_dispatch:      # สร้างปุ่มสำหรับกดรันเพื่อทดสอบด้วยมือตนเองได้

concurrency:
  group: earthquake-update
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Libraries
      # จุดที่แก้ไข: เพิ่ม lxml เข้าไปต่อท้ายแถว เพื่อเป็นตัวขับเคลื่อนเอนจินแกะโค้ด XML ให้ BeautifulSoup
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas lxml

    - name: Execute Script
      run: python update_earthquake.py

    - name: Push GeoJSON Back to Repository
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        if [ -f earthquake_latest.geojson ]; then
          git add earthquake_latest.geojson
          [ -f earthquake_history.geojson ] && git add earthquake_history.geojson
          git commit -m "Automated update earthquake GeoJSON data" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
        else
          echo "[-] ไม่พบไฟล์ earthquake_latest.geojson"
          exit 1
        fi
